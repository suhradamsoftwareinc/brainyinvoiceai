<!doctype html>
<html lang="en"
   xmlns:th="http://www.thymeleaf.org">
   <head>
      <script th:src="@{'/assets/js/color-modes.js'}"></script>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="description" content="">
      <title>Signin</title>
      <link th:href="@{'assets/dist/css/bootstrap.min.css'}" rel="stylesheet">
      <style>
         .bd-placeholder-img {
         font-size: 1.125rem;
         text-anchor: middle;
         -webkit-user-select: none;
         -moz-user-select: none;
         user-select: none;
         }
         @media (min-width: 768px) {
         .bd-placeholder-img-lg {
         font-size: 3.5rem;
         }
         }
         .b-example-divider {
         width: 100%;
         height: 3rem;
         background-color: rgba(0, 0, 0, .1);
         border: solid rgba(0, 0, 0, .15);
         border-width: 1px 0;
         box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
         }
         .b-example-vr {
         flex-shrink: 0;
         width: 1.5rem;
         height: 100vh;
         }
         .bi {
         vertical-align: -.125em;
         fill: currentColor;
         }
         .nav-scroller {
         position: relative;
         z-index: 2;
         height: 2.75rem;
         overflow-y: hidden;
         }
         .nav-scroller .nav {
         display: flex;
         flex-wrap: nowrap;
         padding-bottom: 1rem;
         margin-top: -1px;
         overflow-x: auto;
         text-align: center;
         white-space: nowrap;
         -webkit-overflow-scrolling: touch;
         }
         .btn-bd-primary {
         --bd-violet-bg: #712cf9;
         --bd-violet-rgb: 112.520718, 44.062154, 249.437846;
         --bs-btn-font-weight: 600;
         --bs-btn-color: var(--bs-white);
         --bs-btn-bg: var(--bd-violet-bg);
         --bs-btn-border-color: var(--bd-violet-bg);
         --bs-btn-hover-color: var(--bs-white);
         --bs-btn-hover-bg: #6528e0;
         --bs-btn-hover-border-color: #6528e0;
         --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
         --bs-btn-active-color: var(--bs-btn-hover-color);
         --bs-btn-active-bg: #5a23c8;
         --bs-btn-active-border-color: #5a23c8;
         }
         .bd-mode-toggle {
         z-index: 1500;
         }
         .bd-mode-toggle .dropdown-menu .active .bi {
         display: block !important;
         }
      </style>
      <!-- Custom styles for this template -->
      <link href="assets/dist/css/sign-in.css" rel="stylesheet">
   </head>
   <body class="d-flex align-items-center py-4 bg-body-tertiary">
      <main class="form-signin w-100 m-auto">
		  <div th:if="${param.success}">
                <div class="alert alert-info" th:text="#{registration.successfull.info}"/>
            </div>
            
         <form  method="post" th:action="@{/register}" th:object="${user}">
            <img class="mb-4" th:src="@{'assets/brand/bootstrap-logo.svg'}" alt="" width="72" height="57">
            <h1 class="h3 mb-3 fw-normal" th:text="#{registration.registration}"/>
        
            
            <div class="form-floating">
			   <label for="floatingInput" th:text="#{registration.firstName}"/>
               <input class="form-control" th:classappend="*{firstName} ? 'is-invalid' "
                  id="firstName"
                  name="firstName"
                  placeholder=th:text="#{registration.firstName}"
                  th:field="*{firstName}"
                  type="text"
                  />
                 
            </div>
             <p th:errors="*{firstName}" class="text-danger"
                           th:if="${#fields.hasErrors('firstName')}">
                        </p>
                        
            <div class="form-floating">
               <label for="floatingInput" th:text="#{registration.lastName}"/>
               <input class="form-control" th:classappend="*{firstName} ? 'is-invalid' "
                  id="lastName"
                  name="lastName"
                  placeholder="Enter Last name"
                  th:field="*{lastName}"
                  type="text"
                  />
            </div>
            <p th:errors="*{lastName}" class="text-danger"
                  th:if="${#fields.hasErrors('lastName')}">
               </p>
            <div class="form-floating">
               <label for="floatingInput" th:text="#{registration.email}"/>
               <input class="form-control" th:classappend="*{firstName} ? 'is-invalid' "
                  id="email"
                  name="email"
                  placeholder="Enter Email"
                  th:field="*{email}"
                  type="text"
                  />
            </div>
            <p th:errors="*{email}" class="text-danger"
                  th:if="${#fields.hasErrors('email')}">
               </p>
               
            <div class="form-floating">
               <label for="floatingInput" th:text="#{registration.password}"/>
               <input class="form-control" th:classappend="*{firstName} ? 'is-invalid' "
                  id="password"
                  name="password"
                  placeholder="Enter Password"
                  th:field="*{password}"
                  type="text"
                  />
            </div>
            <p th:errors="*{password}" class="text-danger"
                  th:if="${#fields.hasErrors('password')}">
               </p>
               
            <button class="btn btn-primary w-100 py-2" type="submit" th:text="#{registration.register}"></button>
            <p class="mt-5 mb-3 text-body-secondary">&copy; 2024</p>
            <span th:text="#{registration.AlreadyRegistered}" > </span>
            <a th:href="@{/login}" th:text="#{registration.Login}"> </a>
         </form>
      </main>
      <script th:src="@{'/assets/dist/js/bootstrap.bundle.min.js'}"></script>
   </body>
</html>
